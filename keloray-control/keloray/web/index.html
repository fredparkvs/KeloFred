<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Keloray Control</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 0; background:#111; color:#eee; }
  header { padding: 16px 20px; background:#1b1b1b; border-bottom:1px solid #2a2a2a; }
  h1 { font-size: 18px; margin:0; }
  main { padding: 20px; display:grid; gap:16px; max-width:760px; }
  .card { background:#1b1b1b; border:1px solid #2a2a2a; border-radius:10px; padding:16px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:#555; }
  .dot.on { background:#3ddc84; }
  button { background:#2a2a2a; color:#eee; border:1px solid #3a3a3a; border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover { background:#333; }
  input[type=range]{ flex:1; }
  select, input[type=color]{ background:#2a2a2a; color:#eee; border:1px solid #3a3a3a; border-radius:8px; padding:6px; }
  label { font-size:13px; color:#aaa; min-width:90px; }
  .muted { color:#888; font-size:12px; }
</style>
</head>
<body>
<header><h1>Keloray Control</h1></header>
<main id="app"><p class="muted">Loading devices…</p></main>

<script>
const api = (p, opts) => fetch('/api'+p, opts).then(r => r.json());
const post = (p, body) => api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});

let SCENES = [];

async function load() {
  SCENES = await api('/scenes');
  const devices = await api('/devices');
  const app = document.getElementById('app');
  if (!devices.length) { app.innerHTML = '<p class="muted">No devices bound to this account.</p>'; return; }
  app.innerHTML = '';
  for (const d of devices) app.appendChild(renderDevice(d));
}

function renderDevice(d) {
  const el = document.createElement('div');
  el.className = 'card';
  const opts = SCENES.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
  el.innerHTML = `
    <div class="row"><span class="dot ${d.is_online?'on':''}"></span>
      <strong>${d.alias || d.did}</strong>
      <span class="muted">${d.product_name||''}</span></div>
    <div class="row"><label>Power</label>
      <button data-act="on">On</button><button data-act="off">Off</button></div>
    <div class="row"><label>Brightness</label>
      <input type="range" min="1" max="100" value="80" data-attr="lum"></div>
    <div class="row"><label>Color temp</label>
      <input type="range" min="0" max="100" value="50" data-attr="temperature"></div>
    <div class="row"><label>Color</label>
      <input type="color" value="#ffaa00" data-color></div>
    <div class="row"><label>Scene</label>
      <select data-scene>${opts}</select>
      <button data-act="scene">Run</button>
      <button data-act="stop">Stop</button></div>
  `;
  const did = d.did;
  el.querySelector('[data-act=on]').onclick  = () => post(`/devices/${did}/power`, {on:true});
  el.querySelector('[data-act=off]').onclick = () => post(`/devices/${did}/power`, {on:false});
  el.querySelectorAll('input[data-attr]').forEach(inp => {
    inp.onchange = () => post(`/devices/${did}/control`, {attrs:{[inp.dataset.attr]: Number(inp.value)}});
  });
  el.querySelector('[data-color]').onchange = (e) => {
    const {h,s,v} = hexToHsv(e.target.value);
    post(`/devices/${did}/control`, {attrs:{hsv:{h,s,v}}});
  };
  el.querySelector('[data-act=scene]').onclick = () => {
    const name = el.querySelector('[data-scene]').value;
    post(`/devices/${did}/scene`, {scene:name, params:{}});
  };
  el.querySelector('[data-act=stop]').onclick = () => post(`/devices/${did}/scene/stop`, {});
  return el;
}

function hexToHsv(hex) {
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx-mn;
  let h = 0;
  if (d) {
    if (mx===r) h = ((g-b)/d) % 6;
    else if (mx===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h = Math.round(h*60); if (h<0) h += 360;
  }
  return { h, s: Math.round((mx?d/mx:0)*100), v: Math.round(mx*100) };
}

load();
</script>
</body>
</html>

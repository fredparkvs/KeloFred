[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keloray-control"
version = "0.1.0"
description = "Programmable controller for Keloray / Gizwits smart lights (cloud API)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "apscheduler>=3.10",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
keloray = "keloray.__main__:main"

[tool.setuptools]
packages = ["keloray"]
include-package-data = true

[tool.setuptools.package-data]
keloray = ["web/*.html"]
